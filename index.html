<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Enterprise Analytics Copilot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <h1>Enterprise Analytics Copilot</h1>
    <p>Power BI–style insights on EPICOR data</p>
  </header>

  <main>
    <!-- Ask Bar -->
    <section class="ask">
      <label for="questionInput" class="sr-only">Ask a question</label>
      <input
        id="questionInput"
        placeholder="e.g. Show new SKUs in 2025"
        autocomplete="off"
      />
      <button id="askBtn">Ask</button>
    </section>

    <!-- Status -->
    <div id="status" class="status hidden"></div>

    <!-- Summary -->
    <section id="answer" class="panel hidden">
      <h2>Summary</h2>
      <p id="summary"></p>
    </section>

    <!-- Data Table -->
    <section id="data" class="panel hidden">
      <h2>Details</h2>
      <div id="tableContainer"></div>
    </section>
  </main>

  <footer>
    © ABB Enterprise Analytics
  </footer>

  <!-- Single JS entry -->
  <script src="app.js"></script>
</body>
</html>
