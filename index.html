<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enterprise Analytics Copilot</title>
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <header>
    <h1>📊 Enterprise Analytics Copilot</h1>
    <p>Ask questions about EPICOR data</p>
  </header>

  <main>
    <section class="ask">
      <input
        id="questionInput"
        type="text"
        placeholder="e.g., Show total revenue"
      />
      <button id="askBtn">Ask</button>
    </section>

    <section id="status" class="status hidden"></section>

    <section id="answer" class="answer hidden">
      <h2>Answer</h2>
      <p id="summary"></p>
    </section>
  </main>

  <script>
    const askBtn = document.getElementById("askBtn");
    const input = document.getElementById("questionInput");
    const status = document.getElementById("status");
    const answer = document.getElementById("answer");
    const summary = document.getElementById("summary");

    askBtn.onclick = async () => {
      const question = input.value.trim();
      if (!question) return;

      status.classList.remove("hidden");
      status.innerText = "⏳ Analyzing data...";
      answer.classList.add("hidden");

      try {
        const res = await fetch(
          "https://abb-elip-epicor-chatbot.azurewebsites.net/api/ask",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question })
          }
        );

        if (!res.ok) {
          throw new Error("API call failed");
        }

        const data = await res.json();

        summary.innerText = data.summary || "No answer returned.";
        answer.classList.remove("hidden");
        status.classList.add("hidden");

      } catch (err) {
        status.innerText = "❌ Error connecting to analytics engine.";
      }
    };
  </script>
</body>
</html>
